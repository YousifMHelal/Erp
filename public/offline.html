<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2A2F6B" />
    <title>ERP — لا يوجد اتصال</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f8fc; --card: #ffffff; --fg: #131629; --muted: #525a78; --accent: #14b8a6; --accent-fg: #06312c; --border: #dfe3ee; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0e1c; --card: #141830; --fg: #e8eaf4; --muted: #9aa2c4; --border: #262c4a; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; line-height: 1.6; }
      .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px 24px; text-align: center; }
      .logo { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font: 800 28px/1 system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 24px; color: var(--muted); font-size: 15px; }
      button { min-height: 44px; padding: 0 24px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font: 600 15px system-ui, sans-serif; cursor: pointer; }
      button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
      nav { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
      nav p { margin: 0 0 12px; font-size: 13.5px; }
      nav ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      nav a { display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid var(--border); border-radius: 8px; color: var(--fg); text-decoration: none; font-size: 14px; }
      nav a:hover { border-color: var(--accent); }
      nav a:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">E</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>يحتاج النظام إلى اتصال لعرض الفواتير والأرصدة الحالية. تحقق من الاتصال ثم أعد المحاولة.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
      <nav aria-label="إنشاء بدون اتصال">
        <p>يمكنك إنشاء هذه المستندات بدون اتصال، وستُرسل تلقائياً عند عودته:</p>
        <ul>
          <li><a href="/sales/new">فاتورة بيع</a></li>
          <li><a href="/purchases/new">فاتورة شراء</a></li>
          <li><a href="/collections/new">تحصيل من عميل</a></li>
          <li><a href="/payments/new">دفعة لمورد</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
