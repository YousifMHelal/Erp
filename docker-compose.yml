services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: teba
      POSTGRES_USER: teba
      POSTGRES_PASSWORD: teba_dev_password
    ports:
      - "5433:5432"
    volumes:
      - teba_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teba -d teba"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  teba_postgres_data:
